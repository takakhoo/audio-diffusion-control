# One entry per slider. `positive` and `negative` are appended to a base prompt to form
# the two ends of the slider. `measure` names the descriptor (audiosliders/descriptors.py)
# that should rise with the slider; `dsp` names the post-processing baseline, if one exists.
brightness:
  ends: [dark, bright]
  positive: bright, crisp, sparkling high frequencies, airy treble
  negative: dark, muffled, dull, low-pass filtered, no treble
  measure: centroid_oct
  display: centroid_hz
  dsp: tilt_eq
density:
  ends: [sparse, dense]
  positive: busy, dense, many fast notes, intricate and full arrangement
  negative: sparse, minimal, few notes, lots of space and silence
  measure: onset_rate
reverb:
  ends: [dry, reverberant]
  positive: drenched in reverb, huge cathedral hall, distant, long echoing tail
  negative: completely dry, close-miked, dead room, no reverb
  measure: decay_s
  dsp: reverb
energy:
  ends: [calm, intense]
  positive: intense, aggressive, powerful, loud and driving
  negative: gentle, calm, soft, quiet and delicate
  measure: flux
tempo:
  ends: [slow, fast]
  positive: very fast tempo, rapid, racing, double time
  negative: very slow tempo, sluggish, half time, lingering
  measure: beat_bpm
percussion:
  ends: [no drums, heavy drums]
  positive: heavy drums, pounding percussion, strong beat
  negative: no drums, no percussion, beatless
  measure: percussive_ratio
distortion:
  ends: [clean, distorted]
  positive: distorted, overdriven, gritty, saturated, fuzzy
  negative: clean, pristine, pure tone, undistorted
  measure: flatness
  dsp: drive
lofi:
  ends: [hi-fi, lo-fi]
  positive: lo-fi, old cassette tape, vinyl crackle, degraded, narrow band
  negative: hi-fi, pristine studio recording, crystal clear, full range
  measure: rolloff_oct
  display: rolloff_hz
  measure_sign: -1
  dsp: lofi
bass:
  ends: [thin, bass-heavy]
  positive: heavy sub bass, deep booming low end
  negative: thin, no bass, tinny, only high and mid frequencies
  measure: bass_ratio
  dsp: low_shelf
width:
  ends: [mono, wide]
  positive: very wide stereo, spacious, panned hard left and right
  negative: mono, narrow, centered
  measure: side_ratio
  dsp: mid_side
mood:
  ends: [sad, happy]
  positive: happy, joyful, cheerful, uplifting major key
  negative: sad, melancholic, sorrowful, dark minor key
  measure: majorness
electronic:
  ends: [acoustic, electronic]
  positive: electronic, synthesizers, drum machine, synthetic
  negative: acoustic, live instruments, organic, unplugged
  measure: null

# Musical axes. Several have no signal-processing descriptor; they are scored by CLAP
# direction, the tag panel, and the aesthetics predictor.
harmony:
  ends: [simple harmony, rich harmony]
  positive: rich jazz harmony, complex extended chords, colorful chord changes
  negative: simple harmony, plain triads, one static chord
  measure: harmonic_change
groove:
  ends: [stiff, groovy]
  positive: groovy, syncopated, funky, danceable rhythm
  negative: stiff, plain, unsyncopated, mechanical rhythm
  measure: null
articulation:
  ends: [staccato, legato]
  positive: legato, smooth, flowing, long sustained notes
  negative: staccato, short, detached, plucked notes
  measure: decay_s
ensemble:
  ends: [solo, full ensemble]
  positive: full ensemble, lush layered arrangement, many instruments playing together
  negative: solo instrument, bare, unaccompanied, minimal arrangement
  measure: pc
tension:
  ends: [relaxed, tense]
  positive: tense, suspenseful, dissonant, ominous
  negative: relaxed, peaceful, consonant, soothing
  measure: null
vintage:
  ends: [modern, vintage]
  positive: vintage 1960s recording, old-fashioned, retro
  negative: modern, contemporary, state of the art production
  measure: null
melody:
  ends: [texture, melody]
  positive: strong singable lead melody, tuneful, memorable theme
  negative: no melody, only rhythm and texture, atonal
  measure: key_clarity
dynamics:
  ends: [flat, dynamic]
  positive: dramatic dynamics, swells and crescendos, wide dynamic range
  negative: flat constant level, heavily compressed, no dynamics
  measure: dynamics_db

# Sliders with no prompt pair: trained only from two sets of clips (see audiosliders/contrast.py).
# `measure` is still the descriptor that should follow them, where one applies.
quality:
  ends: [less enjoyable, more enjoyable]
  measure: ce
# The two below keep the polarity of the discovered axis, whose positive end is the calmer or darker one.
arousal:
  ends: [energetic and aggressive, quiet and dreamy]
  measure: flux
  measure_sign: -1
valence:
  ends: [playful and happy, dark and distorted]
  measure: majorness
  measure_sign: -1
jazz_electronic:
  ends: [electronic, jazz]
  measure: null
strings_synth:
  ends: [synthesizer and choir, guitars and strings]
  measure: null
piano_axis:
  ends: [organ and rock, piano]
  measure: null
classical_funk:
  ends: [funk and drums, classical and epic]
  measure: null
acoustic_electronic:
  ends: [studio electronic, acoustic and blues]
  measure: null
